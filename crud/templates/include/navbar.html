    const dark = localStorage.getItem('theme') !== 'light';
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>

<!-- ── Gasiga-mode  ── -->
<style>
  /* Light mode overrides triggered by absence of .dark on <html> */
  html:not(.dark) .light-nav          { background-color: #f9fafb !important; }
  html:not(.dark) .light-nav-border   { border-color: #e5e7eb !important; }
  html:not(.dark) .light-text-dark    { color: #111827 !important; }
  html:not(.dark) .light-dropdown     { background-color: #f3f4f6 !important; border-color: #d1d5db !important; }

</style>

<script>
  /* ── Settings dropdown ── */
  function toggleSettingsMenu() {
    const dd = document.getElementById('settings-dropdown');
    const ch = document.getElementById('settings-chevron');
    const open = !dd.classList.contains('hidden');
    dd.classList.toggle('hidden', open);
    ch.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
  }

  /* Close dropdown when clicking outside */
  document.addEventListener('click', function (e) {
    const wrapper = document.getElementById('settings-menu-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('settings-dropdown').classList.add('hidden');
      document.getElementById('settings-chevron').style.transform = 'rotate(0deg)';
    }
  });

  /* ── Shindo / Maliwanag mode ── */
  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    
    document.getElementById('theme-icon-moon').classList.toggle('hidden', !dark);
    document.getElementById('theme-icon-sun').classList.toggle('hidden', dark);
    
    document.getElementById('theme-label').textContent = dark ? 'Currently on' : 'Currently off';
    
    const pill = document.getElementById('dark-toggle-pill');
    const dot  = document.getElementById('dark-toggle-dot');
    pill.style.backgroundColor = dark ? '#facc15' : '#6b7280';
    dot.style.left = dark ? '1.25rem' : '0.125rem';
  }

  function toggleDarkMode() {
    const isDark = document.documentElement.classList.contains('dark');
    const next = !isDark;
    localStorage.setItem('theme', next ? 'dark' : 'light');
    applyTheme(next);
  }

  /* Init pill state on load */
    (function () {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const dark = saved ? saved === 'dark' : prefersDark;
   applyTheme(dark);
  })();
</script>
