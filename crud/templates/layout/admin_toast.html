{% if messages %}
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3">
    {% for message in messages %}
      <div 
        class="toast-item flex items-center justify-between gap-4 px-4 py-3 rounded-xl border text-sm shadow-lg min-w-[260px] max-w-sm
          {% if message.tags == 'error' %}
            bg-red-500/10 border-red-500/30 text-red-400
          {% elif message.tags == 'success' %}
            bg-green-500/10 border-green-500/30 text-green-400
          {% elif message.tags == 'warning' %}
            bg-yellow-500/10 border-yellow-500/30 text-yellow-400
          {% else %}
            bg-zinc-800 border-zinc-700 text-zinc-300
          {% endif %}
        ">
        <!-- Icon -->
        <div class="flex items-center gap-3">
          {% if message.tags == 'error' %}
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          {% elif message.tags == 'success' %}
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          {% elif message.tags == 'warning' %}
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          {% endif %}
          <span>{{ message }}</span>
        </div>

        <!-- Close button -->
        <button onclick="this.parentElement.remove()" class="text-current opacity-50 hover:opacity-100 transition-opacity cursor-pointer bg-transparent border-none shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    {% endfor %}
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.toast-item').forEach(function (toast) {
        setTimeout(function () {
          toast.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(30px)';
          setTimeout(function () { toast.remove(); }, 500);
        }, 3000);
      });
    });
  </script>
{% endif %}
